# BHOOMAA Medicare Hospital & I.C.U. - static site
#
# Canonical host is the BARE domain (matches the <link rel="canonical"> in
# index.html). www and plain HTTP both 301 here in a single hop.
# Web root is public/, NOT the repository root.

server {
    listen 443 ssl;
    server_name bhoomaahospital.com;

    root /var/www/bhoomaahospital/public;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # HTML is 148 KB uncompressed; gzip takes it to roughly 28 KB.
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml application/manifest+json;

    # Assets are cached for a year - give an image a NEW filename when it changes.
    location ~* \.(jpg|jpeg|png|webp|ico|svg|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # HTML is never cached, so a deploy is visible immediately.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~ /\.git { deny all; return 404; }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/bhoomaahospital.access.log;
    error_log  /var/log/nginx/bhoomaahospital.error.log;

    ssl_certificate /etc/letsencrypt/live/bhoomaahospital.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/bhoomaahospital.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# www over HTTPS -> canonical bare domain. Without this, Google sees two
# complete copies of the site and splits the ranking signals between them.
server {
    listen 443 ssl;
    server_name www.bhoomaahospital.com;

    ssl_certificate /etc/letsencrypt/live/bhoomaahospital.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/bhoomaahospital.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    return 301 https://bhoomaahospital.com$request_uri;
}

# All plain HTTP for either name -> canonical HTTPS, one hop.
# Certbot writes $host here, which sends http://www through https://www first;
# hardcoding the bare domain saves a round trip.
server {
    listen 80;
    server_name bhoomaahospital.com www.bhoomaahospital.com;
    return 301 https://bhoomaahospital.com$request_uri;
}

# Nothing listened on port 80 before this file existed, so the block above would
# otherwise become the default for ALL plain-HTTP traffic - including scans of the
# bare IP. This mirrors the existing :443 catch-all and keeps the IP unindexable.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
