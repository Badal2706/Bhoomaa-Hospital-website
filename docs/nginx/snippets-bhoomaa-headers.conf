# Shared response headers.
#
# nginx does NOT merge add_header across levels: a location that sets any
# add_header discards every header inherited from the server block. Any
# location here that sets Cache-Control must therefore include this file too,
# or it silently serves no security headers at all.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
